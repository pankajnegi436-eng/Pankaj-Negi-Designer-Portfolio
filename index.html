<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pankaj Negi | Motion Designer</title>

    <!-- Tailwind CDN (OK for now) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Global Styles -->
    <style>
      :root {
        --bg-color: #0a0a0a;
        --text-color: #f5f5f5;
      }

      html,
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: 'Inter', sans-serif;
        cursor: none;
      }

      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }

      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }

      ::selection {
        background: #ef4444;
        color: #ffffff;
      }

      a,
      button,
      [role='button'] {
        cursor: none !important;
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- VITE ENTRY POINT -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
